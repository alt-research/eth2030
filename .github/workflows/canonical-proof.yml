name: Real canonical execution proof

on:
  pull_request:
    branches: [master]
    paths: ['pkg/zkvm/**', 'pkg/node/**', 'pkg/rpc/**', 'pkg/cmd/eth2030/**', 'tools/canonical-prover/**', '.github/workflows/canonical-proof.yml']
  push:
    branches: [master]
    paths: ['pkg/zkvm/**', 'pkg/node/**', 'pkg/rpc/**', 'pkg/cmd/eth2030/**', 'tools/canonical-prover/**', '.github/workflows/canonical-proof.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        group: [executor, stf, bridge-backend, native-vectors]
    env:
      CARGO_BUILD_JOBS: 2
      RISC0_BUILD_LOCKED: 1
      GOTOOLCHAIN: go1.26.11
      PROOF_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the isolated pinned proving toolchain
        run: echo "RISC0_HOME=$RUNNER_TEMP/eth2030-risc0-3.1.0" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: pkg/go.sum
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/canonical-prover
      - name: Retain actual proving capacity
        run: |
          nproc
          lscpu
          free -h
          cat /sys/fs/cgroup/cpu.max || true
          cat /sys/fs/cgroup/memory.max || true
      - name: Install pinned local proving components
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/canonical-prover/bootstrap.sh
      - name: Build the native node and complete real-prover bundle
        run: |
          bash tools/canonical-prover/build.sh
          echo "$GITHUB_WORKSPACE/tools/canonical-prover/target/node-bundle" >> "$GITHUB_PATH"
      - name: Require actual proof backend and reject fake/modified seals
        run: |
          command -v eth2030-prover
          command -v r0vm
          cargo fmt --manifest-path tools/canonical-prover/Cargo.toml --all --check
          cargo test --manifest-path tools/canonical-prover/Cargo.toml --release --locked
      - name: Execute the complete selected actual producer and consumer family
        working-directory: pkg
        run: |
          case "$PROOF_GROUP" in
            executor) pattern='^TestCanonExec_' ;;
            stf) pattern='^TestRealSTFExec_' ;;
            bridge-backend) pattern='^TestZKISABridge_|^TestRealExplicitBackendAndProductionVerifier$' ;;
            native-vectors) pattern='^TestRealCanonicalProofThroughNativeNode$|^TestRealReceiptIndependentVerificationAndBindings$|^TestIndependentRV32IMExecutionVectors$' ;;
            *) exit 2 ;;
          esac
          go test -p 1 -tags canonicalproof_integration ./zkvm/... ./node -run "$pattern" -count=1 -timeout=100m -json > canonical-proof-results.jsonl
      - name: Require every actual case in this family
        run: |
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          families={
            'executor':{'TestCanonExec_ExecuteAndProve','TestCanonExec_VerifyGuestProof','TestCanonExec_VerifyGuestProofTampered','TestCanonExec_ProofStatementConsistency'},
            'stf':{'TestRealSTFExec_ExecuteSTF','TestRealSTFExec_VerifySTFProof'},
            'bridge-backend':{'TestZKISABridge_ExecuteZKISA','TestRealExplicitBackendAndProductionVerifier'},
            'native-vectors':{'TestRealReceiptIndependentVerificationAndBindings','TestIndependentRV32IMExecutionVectors','TestRealCanonicalProofThroughNativeNode'},
          }
          events=[json.loads(line) for line in Path('pkg/canonical-proof-results.jsonl').read_text().splitlines()]
          passed={event.get('Test') for event in events if event.get('Action')=='pass'}
          skipped={event.get('Test') for event in events if event.get('Action')=='skip'}
          required=families[os.environ['PROOF_GROUP']]
          assert required<=passed,sorted(required-passed)
          assert not required&skipped,sorted(required&skipped)
          image=json.loads(Path('tools/canonical-prover/target/node-bundle/prover-image.json').read_text())
          assert image['image_id']==Path('tools/canonical-prover/image-id.txt').read_text().strip()
          Path('pkg/canonical-proof-summary.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'group':os.environ['PROOF_GROUP'],'required_passed':sorted(required),'image':image,'required_skipped':[]},indent=2)+'\n')
          PYTHON
      - name: Retain exact real-proof results and source/image identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-proof-${{ matrix.group }}-${{ github.sha }}
          path: |
            pkg/canonical-proof-results.jsonl
            pkg/canonical-proof-summary.json
            tools/canonical-prover/target/node-bundle/build-info.json
            tools/canonical-prover/target/node-bundle/prover-image.json
          if-no-files-found: error
          retention-days: 90

  real-proof-success:
    runs-on: ubuntu-latest
    needs: real-proof
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: canonical-proof-*-${{ github.sha }}
          path: proof-results
      - name: Require all four families at one source and fixed image
        env:
          MATRIX_RESULT: ${{ needs.real-proof.result }}
        run: |
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          assert os.environ['MATRIX_RESULT']=='success',os.environ['MATRIX_RESULT']
          summaries=[json.loads(path.read_text()) for path in Path('proof-results').rglob('canonical-proof-summary.json')]
          assert len(summaries)==4,len(summaries)
          assert {item['group'] for item in summaries}=={'executor','stf','bridge-backend','native-vectors'}
          expected=Path('tools/canonical-prover/image-id.txt').read_text().strip()
          for item in summaries:
            assert item['source']==os.environ['GITHUB_SHA']
            assert item['image']['image_id']==expected
            assert item['required_skipped']==[]
          assert len({case for item in summaries for case in item['required_passed']})==11
          print('All 11 actual proof acceptance cases passed without skipping at the same source and pinned guest image.')
          PYTHON
